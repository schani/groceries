<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Groceries">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Groceries</title>
<style>
:root{
  --accent:#1E9E55;
  --accent-press:#178446;
  --bg:#F2F2F7;
  --card:#FFFFFF;
  --label:#000000;
  --label2:rgba(60,60,67,.6);
  --label3:rgba(60,60,67,.3);
  --placeholder:rgba(60,60,67,.42);
  --sep:rgba(60,60,67,.29);
  --fill:rgba(118,118,128,.12);
  --fill-strong:rgba(118,118,128,.2);
  --red:#FF3B30;
  --red-tint:rgba(255,59,48,.1);
  --press:#D1D1D6;
  --ring:#C4C4C9;
  --act-gray:#8E8E93;
  --glass:rgba(255,255,255,.62);
  --glass-hi:rgba(255,255,255,.95);
  --glass-edge:rgba(0,0,0,.07);
  --glass-shadow:0 10px 30px rgba(0,0,0,.10),0 2px 6px rgba(0,0,0,.06);
  --card-shadow:0 .5px 0 rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.04);
  --lift-shadow:0 18px 40px rgba(0,0,0,.18),0 4px 10px rgba(0,0,0,.08);
  --hair:1px;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);
  --sar:env(safe-area-inset-right,0px);
  --kb:0px;
  --spring:cubic-bezier(.34,1.36,.64,1);
  --spring-soft:cubic-bezier(.3,1.18,.5,1);
  --ease:cubic-bezier(.32,.72,0,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
}
@media (min-resolution:2dppx){:root{--hair:.5px}}
@media (prefers-color-scheme:dark){
  :root{
    --accent:#34D07A;
    --accent-press:#2AB868;
    --bg:#000000;
    --card:#1C1C1E;
    --label:#FFFFFF;
    --label2:rgba(235,235,245,.6);
    --label3:rgba(235,235,245,.3);
    --placeholder:rgba(235,235,245,.4);
    --sep:rgba(84,84,88,.65);
    --fill:rgba(118,118,128,.24);
    --fill-strong:rgba(118,118,128,.32);
    --red:#FF453A;
    --red-tint:rgba(255,69,58,.16);
    --press:#3A3A3C;
    --ring:#55555A;
    --act-gray:#636366;
    --glass:rgba(38,38,42,.58);
    --glass-hi:rgba(255,255,255,.16);
    --glass-edge:rgba(255,255,255,.07);
    --glass-shadow:0 10px 30px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);
    --card-shadow:none;
    --lift-shadow:0 18px 40px rgba(0,0,0,.6),0 4px 10px rgba(0,0,0,.4);
  }
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
body{
  font-family:var(--font);color:var(--label);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none}
button:focus{outline:none}
button:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea{font-family:var(--font);-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img{-webkit-user-drag:none;user-select:none}
svg{display:block}

/* ---------- Device / frame ---------- */
.device{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
.app{position:absolute;inset:0;overflow:hidden;background:var(--bg)}
.island,.statusbar,.homebar{display:none}

@media (min-width:501px){
  html,body{background:#E4E4E9}
  body{
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 90% at 50% 0%,#F4F4F7 0%,#DCDCE2 100%);
  }
  .device{
    position:relative;inset:auto;width:390px;height:844px;flex:none;
    border-radius:55px;
    transform:scale(var(--frame-scale,1));
    box-shadow:
      0 0 0 10px #101012,
      0 0 0 11.5px #3A3A3E,
      0 0 0 12px #1A1A1C,
      0 50px 90px -20px rgba(0,0,0,.35),
      0 30px 60px -30px rgba(0,0,0,.3);
    isolation:isolate;
  }
  .app{--sat:54px;--sab:34px;--sal:0px;--sar:0px;border-radius:55px}
  .island{display:block;position:absolute;top:11px;left:50%;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000;z-index:60;pointer-events:none}
  .statusbar{
    display:flex;position:absolute;top:0;left:0;right:0;height:54px;z-index:59;pointer-events:none;
    align-items:center;justify-content:space-between;padding:4px 30px 0 52px;color:var(--label);
  }
  .statusbar .time{font-size:17px;font-weight:600;letter-spacing:-.4px}
  .statusbar .icons{display:flex;gap:6px;align-items:center}
  .homebar{display:block;position:absolute;bottom:8px;left:50%;width:136px;height:5px;margin-left:-68px;border-radius:3px;background:var(--label);z-index:60;pointer-events:none}
}
@media (min-width:501px) and (prefers-color-scheme:dark){
  html,body{background:#0E0E10}
  body{background:radial-gradient(120% 90% at 50% 0%,#232327 0%,#0B0B0D 100%)}
  .device{box-shadow:0 0 0 10px #000,0 0 0 11.5px #3A3A3E,0 0 0 12px #1A1A1C,0 50px 90px -20px rgba(0,0,0,.7)}
}

/* ---------- Scroll area ---------- */
.scroller{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;
  scrollbar-width:none;
}
.scroller::-webkit-scrollbar{display:none}
.content{
  min-height:100%;
  padding:calc(var(--sat) + 10px) calc(16px + var(--sar)) var(--pad-bottom,120px) calc(16px + var(--sal));
}

.empty{
  text-align:center;padding:28px 32px 30px;color:var(--label2);
  animation:fadeUp .5s var(--ease) both;
}
.empty[hidden]{display:none}
.empty .ico{width:48px;height:48px;margin:0 auto 10px;color:var(--label3)}
.empty h2{margin:0;font-size:20px;line-height:25px;font-weight:600;color:var(--label);letter-spacing:.38px}
.empty p{margin:4px 0 0;font-size:15px;line-height:20px;letter-spacing:-.24px}

.topfade{
  position:absolute;top:0;left:0;right:0;height:calc(var(--sat) + 8px);z-index:30;pointer-events:none;
  background:linear-gradient(to bottom,var(--bg) 0%,var(--bg) 70%,transparent 100%);
}
.botfade{
  position:absolute;left:0;right:0;bottom:0;height:calc(var(--sab) + 72px + var(--kb));z-index:15;pointer-events:none;
  background:linear-gradient(to bottom,transparent 0%,var(--bg) 85%);opacity:.7;
}

/* ---------- Inset grouped lists ---------- */
.sec{
  margin:0;padding:24px 16px 7px;font-size:13px;line-height:18px;font-weight:400;
  text-transform:uppercase;letter-spacing:-.08px;color:var(--label2);
  transition:opacity .25s var(--ease);
}
.sec[hidden]{display:none}
.group{list-style:none;margin:0;padding:0;position:relative}
.cell{
  position:relative;overflow:hidden;background:var(--card);
  transform:translateZ(0);
  transition:border-radius .22s var(--ease);
}
.cell.first{border-top-left-radius:12px;border-top-right-radius:12px}
.cell.last{border-bottom-left-radius:12px;border-bottom-right-radius:12px}

/* swipe actions (behind the row) */
.acts{position:absolute;top:0;right:0;bottom:0;width:0;display:flex;overflow:hidden}
.act{
  flex:1 1 0;min-width:0;height:100%;overflow:hidden;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:12px;line-height:15px;font-weight:600;letter-spacing:-.05px;white-space:nowrap;
  transition:flex-grow .26s var(--ease),padding .26s var(--ease);
}
.act svg{flex:none}
.act-edit{background:var(--act-gray)}
.act-del{background:var(--red)}
.act:active{filter:brightness(.88)}
.cell.armed .act-edit{flex-grow:.0001}
.cell.armed .act-del{align-items:flex-start;padding-left:26px}

.slide{position:relative;background:var(--card);will-change:transform;transition:background-color .35s var(--ease)}
.slide::after{
  content:"";position:absolute;left:54px;right:0;bottom:0;height:1px;
  background:var(--sep);transform:scaleY(.5);transform-origin:0 100%;pointer-events:none;
}
.cell.last .slide::after,.cell.dragging .slide::after{display:none}
.cell.snap .slide{transition:transform .42s var(--spring-soft),background-color .35s var(--ease)}
.cell.snap .acts{transition:width .42s var(--spring-soft)}
.cell.fly .slide{transition:transform .22s cubic-bezier(.4,0,1,1)}
.cell.fly .acts{transition:width .22s cubic-bezier(.4,0,1,1)}
.cell.pressed .slide{background:var(--press);transition:none}

.row{
  position:relative;display:flex;align-items:center;min-height:50px;padding-left:16px;
  touch-action:pan-y;cursor:pointer;outline:none;
}
.row:focus-visible{box-shadow:inset 0 0 0 2px var(--accent)}
.check{
  position:relative;flex:none;width:23px;height:23px;margin-right:15px;border-radius:50%;
  box-shadow:inset 0 0 0 1.6px var(--ring);
  display:flex;align-items:center;justify-content:center;color:#fff;
  transition:background-color .2s var(--ease),box-shadow .2s var(--ease);
}
.check svg{transform:scale(.3);opacity:0;transition:transform .32s var(--spring),opacity .15s var(--ease)}
.cell.checked .check{background:var(--accent);box-shadow:inset 0 0 0 1.6px var(--accent)}
.cell.checked .check svg{transform:none;opacity:1}
.check.pop{animation:pop .42s var(--spring)}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(.78)}65%{transform:scale(1.14)}100%{transform:scale(1)}}

.text{flex:1 1 auto;min-width:0;padding:14px 0 14px}
.cell.has-desc .text{padding:8px 0 9px}
.name{
  font-size:17px;line-height:22px;letter-spacing:-.41px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:var(--label);transition:color .25s var(--ease);
  text-decoration-line:line-through;text-decoration-color:transparent;text-decoration-thickness:1.5px;
}
.cell.checked .name{color:var(--placeholder);text-decoration-color:var(--placeholder)}
.desc{
  font-size:14px;line-height:18px;color:var(--label2);letter-spacing:-.15px;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .25s var(--ease);
}
.cell.checked .desc{color:var(--label3)}
.cell:not(.has-desc) .desc{display:none}

.thumb{
  position:relative;flex:none;width:36px;height:36px;border-radius:8px;overflow:hidden;margin-left:10px;background:var(--fill);
  transition:opacity .25s var(--ease),transform .2s var(--spring);
}
.thumb::before{content:"";position:absolute;inset:-7px -5px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.thumb::after{content:"";position:absolute;inset:0;border-radius:8px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08)}
.thumb:active{transform:scale(.92)}
.cell.checked .thumb{opacity:.5}
.cell:not(.has-photo) .thumb{display:none}

.grip{
  flex:none;width:46px;align-self:stretch;min-height:50px;display:flex;align-items:center;justify-content:center;
  color:var(--label3);touch-action:none;cursor:grab;transition:color .2s var(--ease);
}
.grip:active{cursor:grabbing}
.done{
  display:none;flex:none;height:50px;padding:0 16px 0 12px;align-self:flex-start;
  font-size:17px;font-weight:600;letter-spacing:-.41px;color:var(--accent);
}
.done:active{opacity:.5}

/* drag */
.cell.dragging{
  z-index:40;border-radius:12px;box-shadow:var(--lift-shadow);
}
.cell.dragging .grip{color:var(--accent)}
.cell.shift{transition:transform .38s var(--spring-soft),border-radius .22s var(--ease)}
.cell.settling{transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-radius .22s var(--ease)}
.cell.flip{transition:transform .52s var(--spring-soft),border-radius .22s var(--ease)}
.cell.mover{z-index:5}
.cell.removing{transition:height .34s var(--ease),border-radius .22s var(--ease)}
.cell.removing.fade .slide{opacity:0;transition:opacity .2s var(--ease)}
.cell.enter .slide{animation:rowIn .5s var(--spring-soft) both}
.no-anim,.no-anim *{transition:none !important}

@keyframes rowIn{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- Edit in place ---------- */
.name-input{
  display:block;width:calc(100% + 8px);height:36px;margin:7px 0 7px -8px;padding:0 8px;border:0;border-radius:9px;
  background:var(--fill);color:var(--label);outline:none;caret-color:var(--accent);
  font-size:17px;font-weight:600;letter-spacing:-.41px;-webkit-appearance:none;appearance:none;
}
.name-input::placeholder{color:var(--placeholder)}
.cell.open .row{cursor:default;align-items:flex-start}
.cell.open .check{margin-top:13.5px;opacity:.55}
.cell.open .text{padding:0}
.cell.open .name,.cell.open .desc,.cell.open .thumb,.cell.open .grip{display:none}
.cell.open .done{display:block}
.editor{height:0;overflow:hidden;transition:height .5s var(--spring-soft)}
.ed-inner{padding:2px 14px 14px 54px;opacity:0;transform:translateY(-6px);transition:opacity .28s var(--ease) .06s,transform .45s var(--ease)}
.cell.open .ed-inner{opacity:1;transform:none}
.f-desc{
  display:block;width:100%;border:0;margin:0;background:var(--fill);color:var(--label);border-radius:9px;
  outline:none;caret-color:var(--accent);-webkit-appearance:none;appearance:none;
  padding:9px 10px 10px;font-size:16px;line-height:21px;letter-spacing:-.3px;resize:none;min-height:40px;overflow:hidden;
}
.f-desc::placeholder{color:var(--placeholder)}
.photo{position:relative;margin-top:10px;border-radius:12px;overflow:hidden;background:var(--fill)}
.photo img{display:block;width:100%;height:210px;object-fit:cover;pointer-events:none}
.photo-actions{position:absolute;right:8px;bottom:8px;display:flex;gap:8px}
.pill{
  position:relative;height:34px;min-width:34px;padding:0 12px;border-radius:17px;
  display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:15px;font-weight:600;letter-spacing:-.24px;color:#fff;
  background:rgba(30,30,32,.42);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  box-shadow:inset 0 .5px 0 rgba(255,255,255,.3),inset 0 0 0 .5px rgba(255,255,255,.12);
}
.pill.icon{padding:0;width:34px}
.pill::before,.send::before,.chip-x::before{content:"";position:absolute;inset:-5px}
.add-photo{
  width:100%;height:42px;margin-top:10px;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:7px;
  font-size:16px;letter-spacing:-.32px;background:var(--fill);color:var(--accent);font-weight:500;
  transition:background-color .15s,transform .2s var(--spring);
}
.add-photo:active,.pill:active{transform:scale(.97)}
.add-photo:active{background:var(--fill-strong)}

/* ---------- Photo viewer ---------- */
.viewer{
  position:absolute;inset:0;z-index:80;background:rgba(0,0,0,0);cursor:zoom-out;
  transition:background-color .32s var(--ease);
}
.viewer[hidden]{display:none}
.viewer.on{background:rgba(0,0,0,.94)}
.viewer img{
  position:absolute;inset:0;margin:auto;max-width:100%;max-height:calc(100% - var(--sat) - var(--sab) - 40px);
  display:block;transform-origin:0 0;pointer-events:none;
}
.viewer img.anim{transition:transform .42s var(--spring-soft),opacity .25s var(--ease),border-radius .42s var(--ease)}


/* ---------- Composer ---------- */
.composer{
  position:absolute;left:0;right:0;z-index:50;
  bottom:max(calc(var(--sab) - 8px),12px);
  display:flex;align-items:flex-end;gap:8px;
  padding:0 calc(12px + var(--sar)) 0 calc(12px + var(--sal));
  transition:bottom .3s var(--ease),transform .42s var(--ease),opacity .25s var(--ease);
}
.app.kb-open .composer{bottom:calc(var(--kb) + 8px)}
.app.editing .composer{transform:translateY(140%);opacity:0;pointer-events:none}
.glass{
  background:var(--glass);
  -webkit-backdrop-filter:blur(22px) saturate(190%);backdrop-filter:blur(22px) saturate(190%);
  box-shadow:inset 0 .5px 0 var(--glass-hi),inset 0 0 0 .5px var(--glass-edge),var(--glass-shadow);
}
.cam{
  width:48px;height:48px;border-radius:24px;flex:none;display:flex;align-items:center;justify-content:center;
  color:var(--label);transition:transform .3s var(--spring);
}
.cam:active{transform:scale(.9)}
.capsule{
  flex:1 1 auto;min-width:0;height:48px;border-radius:24px;display:flex;align-items:center;
  padding:0 6px 0 18px;transition:padding .3s var(--ease);
}
.composer.has-photo .capsule{padding-left:7px}
.chip{
  position:relative;flex:none;width:34px;height:34px;border-radius:17px;margin-right:10px;
  animation:chipIn .45s var(--spring) both;
}
.chip[hidden]{display:none}
.chip img{width:100%;height:100%;object-fit:cover;border-radius:17px;display:block;pointer-events:none;box-shadow:0 0 0 .5px rgba(0,0,0,.1)}
.chip-x{
  position:absolute;top:-5px;right:-6px;width:19px;height:19px;border-radius:50%;
  background:var(--label);color:var(--card);display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 2px var(--card);
}
@keyframes chipIn{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.add-input{
  flex:1 1 auto;min-width:0;height:46px;border:0;background:transparent;outline:none;padding:0;
  font-size:17px;letter-spacing:-.41px;color:var(--label);caret-color:var(--accent);
}
.add-input::placeholder{color:var(--placeholder)}
.send{
  position:relative;flex:none;width:36px;height:36px;border-radius:18px;margin-left:6px;
  background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;
  transform:scale(.2);opacity:0;pointer-events:none;
  transition:transform .4s var(--spring),opacity .18s var(--ease),background-color .15s;
  box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 40%,transparent);
}
.composer.has-text .send{transform:none;opacity:1;pointer-events:auto}
.send:active{background:var(--accent-press);transform:scale(.88)}

.file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:-9999px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-delay:0s !important;transition-duration:.01ms !important;transition-delay:0s !important;scroll-behavior:auto !important}
}
</style>
</head>
<body>
<div class="device" id="device">
  <div class="island" aria-hidden="true"></div>
  <div class="statusbar" aria-hidden="true">
    <span class="time">9:41</span>
    <span class="icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.6c2.2 0 4.2.85 5.7 2.25l1.1-1.1A9.6 9.6 0 0 0 8 1 9.6 9.6 0 0 0 1.2 3.75l1.1 1.1A8.1 8.1 0 0 1 8 2.6Zm0 3.2c1.3 0 2.5.5 3.4 1.3l1.1-1.1A6.4 6.4 0 0 0 8 4.2c-1.7 0-3.3.65-4.5 1.8l1.1 1.1c.9-.8 2.1-1.3 3.4-1.3Zm0 3.2c-.45 0-.86.17-1.17.45L8 10.6l1.17-1.15A1.7 1.7 0 0 0 8 9Z"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x=".5" y=".5" width="23" height="12" rx="3.8" stroke="currentColor" opacity=".35"/><rect x="2" y="2" width="20" height="9" rx="2.5" fill="currentColor"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" fill="currentColor" opacity=".4"/></svg>
    </span>
  </div>
  <div class="homebar" aria-hidden="true"></div>

  <div class="app" id="app">
    <div class="scroller" id="scroller">

/* ---------------- FLIP ---------------- */

/* ---------------- Composer ---------------- */
let pendingPhoto = null;

sendBtn.addEventListener('click', () => { addItem(); input.focus({ preventScroll: true }); });
chipX.addEventListener('pointerdown', e => e.preventDefault());
chipX.addEventListener('click', () => setPending(null));
camBtn.addEventListener('click', async () => {
  const url = await pickPhoto();
  if (url) { setPending(url); input.focus({ preventScroll: true }); }
});

/* ---------------- Photos ---------------- */
function pickPhoto() {
  return new Promise(resolve => {
    fileInput.value = '';
    fileInput.onchange = async () => {
      const f = fileInput.files && fileInput.files[0];
      if (!f) return resolve(null);
      try { resolve(await downscale(f)); } catch (e) { console.warn('Could not read image', e); resolve(null); }
    };
    fileInput.click();
  });
}
function downscale(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1024 / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1, Math.round(img.naturalWidth * s)), h = Math.max(1, Math.round(img.naturalHeight * s));
      const c = canvas(w, h), x = c.getContext('2d');
      x.fillStyle = '#fff'; x.fillRect(0, 0, w, h);
      x.imageSmoothingQuality = 'high';
      x.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', .82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode failed')); };
    img.src = url;
  });
}

/* ---------------- Full-screen photo ---------------- */
let viewerFrom = null;
function thumbTransform(thumb) {
  const k = fs();
  const ar = app.getBoundingClientRect(), tr = thumb.getBoundingClientRect();
  const iw = viewerImg.offsetWidth, ih = viewerImg.offsetHeight;
  const il = viewerImg.offsetLeft, it = viewerImg.offsetTop;
  const tw = tr.width / k, th = tr.height / k;
  const s = Math.max(tw / iw, th / ih);
  const x = (tr.left - ar.left) / k + tw / 2 - (il + iw * s / 2);
  const y = (tr.top - ar.top) / k + th / 2 - (it + ih * s / 2);
  return `translate(${x}px,${y}px) scale(${s})`;
}
async function openViewer(li) {
  const it = findItem(li.dataset.id);
  if (!it || !it.photo) return;
  closeReveal();
  const thumb = $('.thumb', li);
  viewerFrom = li.dataset.id;
  viewerImg.src = it.photo;
  viewerImg.alt = `Photo of ${it.name}`;
  try { await viewerImg.decode(); } catch (_) {}
  viewer.hidden = false;
  viewerImg.classList.remove('anim');
  viewerImg.style.opacity = '1';
  viewerImg.style.transform = thumbTransform(thumb);
  viewer.getBoundingClientRect();
  viewerImg.classList.add('anim');
  viewer.classList.add('on');
  viewerImg.style.transform = '';
  viewer.tabIndex = -1; viewer.focus({ preventScroll: true });
}
function closeViewer() {
  if (viewer.hidden) return;
  const li = cellById(viewerFrom);
  const thumb = li && $('.thumb', li);
  viewer.classList.remove('on');
  let visible = false;
  if (thumb && li.classList.contains('has-photo')) {
    const r = thumb.getBoundingClientRect(), s = scroller.getBoundingClientRect();
    visible = r.height > 0 && r.bottom > s.top && r.top < s.bottom;
  }
  if (visible) viewerImg.style.transform = thumbTransform(thumb);
  else viewerImg.style.opacity = '0';
  setTimeout(() => { viewer.hidden = true; viewerImg.classList.remove('anim'); viewerImg.style.transform = ''; viewerImg.removeAttribute('src'); }, dur(400));
  viewerFrom = null;
}
viewer.addEventListener('click', closeViewer);
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeViewer(); closeReveal(); if (openId) collapse(cellById(openId)); } });

/* ---------------- Edit in place ---------------- */
function buildEditor(li, it) {
  // the row's own name becomes the field — no duplicate name
  const nameInput = document.createElement('input');
  Object.assign(nameInput, { className: 'name-input', type: 'text', placeholder: 'Name', autocomplete: 'off', maxLength: 80 });
  nameInput.setAttribute('aria-label', 'Name');
  nameInput.setAttribute('enterkeyhint', 'done');
  nameInput.setAttribute('autocapitalize', 'sentences');
  nameInput.value = it.name;
  $('.name', li).after(nameInput);
  nameInput.addEventListener('input', () => {
    const v = nameInput.value.trim().replace(/\s+/g, ' ');
    if (v) { it.name = v; fillRow(li, it); save(); }
  });
  nameInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); nameInput.blur(); } });
  nameInput.addEventListener('blur', () => { if (!nameInput.value.trim()) nameInput.value = it.name; });

  const ed = $('.editor', li);
  ed.innerHTML =
    `<div class="ed-inner">
      <textarea class="f-desc" rows="1" aria-label="Description" placeholder="Add a description"></textarea>
      <div class="photo-slot"></div>
    </div>`;
  const fDesc = $('.f-desc', ed);
  fDesc.value = it.desc || '';
  const grow = () => { fDesc.style.height = 'auto'; fDesc.style.height = fDesc.scrollHeight + 'px'; };
  fDesc.addEventListener('input', () => { it.desc = fDesc.value; fillRow(li, it); save(); grow(); });
  renderPhotoSlot(li, it);
  grow();
}
function renderPhotoSlot(li, it) {
  const slot = $('.photo-slot', li);
  if (!slot) return;
  if (it.photo) {
    slot.innerHTML = `<div class="photo"><img alt="">
      <div class="photo-actions">
        <button class="pill replace">${ICON.camera}<span>Replace</span></button>
        <button class="pill icon rm-photo" aria-label="Remove photo">${ICON.x}</button>
      </div></div>`;
    const img = $('img', slot); img.src = it.photo; img.alt = 'Photo of ' + it.name;
    $('.replace', slot).addEventListener('click', () => choosePhoto(li, it));
    $('.rm-photo', slot).addEventListener('click', () => { it.photo = null; save(true); fillRow(li, it); renderPhotoSlot(li, it); });
  } else {
    slot.innerHTML = `<button class="add-photo">${ICON.camera}<span>Add Photo</span></button>`;
    $('.add-photo', slot).addEventListener('click', () => choosePhoto(li, it));
  }
}
async function choosePhoto(li, it) {
  const url = await pickPhoto();
  if (!url) return;
  it.photo = url; save(true); fillRow(li, it); renderPhotoSlot(li, it);
  const p = $('.photo', li);
  if (p) setTimeout(() => ensureVisible(p, 16, true), 60);
}

function expand(li) {
  const id = li.dataset.id, it = findItem(id);
  if (!it || li.classList.contains('removing')) return;
  if (openId && openId !== id) collapse(cellById(openId));
  openId = id;
  buildEditor(li, it);
  const ed = $('.editor', li);
  li.classList.add('open');
  const h = $('.ed-inner', ed).offsetHeight;
  ed.style.height = '0px';
  ed.getBoundingClientRect();
  ed.style.height = h + 'px';
  // follow the growing row so it stays visible (scroll down only, never past its top)
  const t0 = performance.now(), D = dur(500);
  const follow = () => {
    if (openId !== id) return;
    const k = fs();
    const sr = scroller.getBoundingClientRect(), r = li.getBoundingClientRect();
    const over = (r.bottom - sr.top) / k - (composerTop() / k - 8);
    const room = (r.top - sr.top) / k - (topInset() + 8);
    if (over > 0 && room > 0) scroller.scrollTop += Math.min(over, room);
    if (performance.now() - t0 < D + 60) requestAnimationFrame(follow);
  };
  requestAnimationFrame(follow);
  setTimeout(() => { if (openId === id) ed.style.height = 'auto'; }, D);
}
function collapse(li, instant) {
  if (!li) { openId = null; return; }
  if (openId === li.dataset.id) openId = null;
  const ed = $('.editor', li);
  const a = document.activeElement;
  if (a && li.contains(a)) a.blur();
  const finish = () => {
    if (li.classList.contains('open')) return;
    ed.textContent = '';
    const ni = $('.name-input', li); if (ni) ni.remove();
  };
  const it = findItem(li.dataset.id);
  if (it) fillRow(li, it);
  if (instant || reduceMQ.matches) {
    li.classList.add('no-anim');
    li.classList.remove('open');
    ed.style.height = '0px';
    finish();
    li.getBoundingClientRect();
    li.classList.remove('no-anim');
    return;
  }
  // keep the header height stable while the editor shrinks, then swap back to the label
  ed.style.height = ed.offsetHeight + 'px';
  ed.getBoundingClientRect();
  ed.style.transition = 'height .36s var(--ease)';
  ed.style.height = '0px';
  li.classList.remove('open');
  setTimeout(() => { ed.style.transition = ''; finish(); }, dur(380));
}

// editing state: hide composer while a row field has focus
document.addEventListener('focusin', e => {
  const inCell = !!(e.target.closest && e.target.closest('.cell'));
  app.classList.toggle('editing', inCell && e.target.matches('input,textarea'));
  layoutPad();
});
document.addEventListener('focusout', () => {
  setTimeout(() => {
    const a = document.activeElement;
    const still = a && a.closest && a.closest('.cell') && a.matches('input,textarea');
    if (!still) { app.classList.remove('editing'); layoutPad(); }
  }, 0);
});

/* ---------------- Removal ---------------- */
function removeCell(li, swiped) {
  const id = li.dataset.id;
  if (openId === id) openId = null;
  if (revealed === li) revealed = null;
  const a = document.activeElement;
  if (a && li.contains(a)) a.blur();
  state.items = state.items.filter(i => i.id !== id);
  save(true);
  haptic();
  li.style.height = li.offsetHeight + 'px';
  li.getBoundingClientRect();
  li.classList.add('removing');
  if (!swiped) li.classList.add('fade');
  li.style.height = '0px';
  updateShapes();
  setTimeout(() => { li.remove(); updateShapes(); }, dur(360));
}

/* ---------------- Swipe actions ---------------- */
const REV = 148; // revealed width (two 74px buttons)
let revealed = null;
function setSlide(li, x, cls) {
  const slide = $('.slide', li), acts = $('.acts', li);
  if (cls) { li.classList.remove('snap', 'fly'); li.classList.add(cls); }
  slide.style.transform = x ? `translate3d(${x}px,0,0)` : '';
  acts.style.width = Math.max(0, -x) + 'px';
  if (cls) {
    clearTimeout(li._snapT);
    li._snapT = setTimeout(() => li.classList.remove(cls), dur(cls === 'fly' ? 230 : 440));
  }
}
function openReveal(li) {
  if (revealed && revealed !== li) closeReveal();
  revealed = li;
  li.classList.remove('armed');
  setSlide(li, -REV, 'snap');
  $('.act-edit', li).tabIndex = 0; $('.act-del', li).tabIndex = 0;
}
function closeReveal(instant) {
  const li = revealed;
  if (!li) return;
  revealed = null;
  li.classList.remove('armed');
  if (instant) { li.classList.add('no-anim'); setSlide(li, 0); li.getBoundingClientRect(); li.classList.remove('no-anim'); }
  else setSlide(li, 0, 'snap');
  $('.act-edit', li).tabIndex = -1; $('.act-del', li).tabIndex = -1;
}
function fullDelete(li) {
  if (revealed === li) revealed = null;
  li.classList.add('armed');
  setSlide(li, -li.offsetWidth - 2, 'fly');
  setTimeout(() => removeCell(li, true), dur(200));
}
function onActClick(e) {
  const btn = e.target.closest('.act');
  if (!btn) return;
  const li = btn.closest('.cell');
  if (btn.classList.contains('act-del')) fullDelete(li);
  else { closeReveal(); expand(li); }
}
g0.addEventListener('click', onActClick);
g1.addEventListener('click', onActClick);
scroller.addEventListener('scroll', () => { if (revealed && !gesture) closeReveal(); }, { passive: true });

/* ---------------- Pointer handling ---------------- */
let gesture = null, swallow = null, dismiss = null;
// capture phase: a tap anywhere first dismisses revealed actions / open editor
document.addEventListener('pointerdown', e => {
  swallow = null; dismiss = null;
  if (!viewer.hidden) return;
  const t = e.target;
  if (revealed) {
    if (revealed.contains(t)) return;
    closeReveal();
    swallow = e.pointerId;
    return;
  }
  if (openId) {
    const li = cellById(openId);
    if (li && !li.contains(t) && !composer.contains(t) && !(t.closest && t.closest('.grip'))) {
      dismiss = { pid: e.pointerId, x: e.clientX, y: e.clientY };
      swallow = e.pointerId;
    }
  }
}, true);

function onListDown(e) {
  if (e.button !== 0 || drag || swallow === e.pointerId) return;
  const t = e.target;
  const li = t.closest('.cell');
  if (!li || li.classList.contains('removing') || li.classList.contains('open')) return;
  if (t.closest('.acts')) return;
  const grip = t.closest('.grip');
  if (grip) { startDrag(e, li, grip); return; }
  const row = t.closest('.row');
  if (!row) return;
  const thumb = !!t.closest('.thumb');
  const base = revealed === li ? -REV : 0;
  const now = performance.now();
  gesture = { li, row, thumb, base, x: e.clientX, y: e.clientY, pid: e.pointerId, mode: 'pending', dx: base, lastX: e.clientX, lastT: now, v: 0 };
  if (!thumb && !base) gesture.pressTimer = setTimeout(() => { if (gesture && gesture.li === li && gesture.mode === 'pending') li.classList.add('pressed'); }, 60);
}
g0.addEventListener('pointerdown', onListDown);
g1.addEventListener('pointerdown', onListDown);

document.addEventListener('pointermove', e => {
  if (drag && e.pointerId === drag.pid) { drag.lastY = e.clientY; dragMove(); return; }
  const g = gesture;
  if (!g || e.pointerId !== g.pid) return;
  const dx = e.clientX - g.x, dy = e.clientY - g.y;
  if (g.mode === 'pending') {
    if (Math.hypot(dx, dy) <= 8) return;
    clearTimeout(g.pressTimer);
    g.li.classList.remove('pressed');
    if (Math.abs(dx) > Math.abs(dy) * 1.2 && (dx < 0 || g.base < 0)) {
      g.mode = 'swipe';
      g.x = e.clientX; // start from here to avoid a jump
      g.w = g.li.offsetWidth;
      if (revealed && revealed !== g.li) closeReveal();
      g.li.classList.remove('snap', 'fly');
      try { g.row.setPointerCapture(e.pointerId); } catch (_) {}
    } else {
      gesture = null; // native scroll takes over
    }
    return;
  }
  if (g.mode === 'swipe') {
    e.preventDefault();
    const k = fs();
    let x = g.base + (e.clientX - g.x) / k;
    if (x > 0) x = x * .2; // resist rightward
    const now = performance.now();
    g.v = (e.clientX - g.lastX) / k / Math.max(1, now - g.lastT);
    g.lastX = e.clientX; g.lastT = now;
    g.dx = x;
    setSlide(g.li, x);
    const armed = -x > g.w * .62;
    if (armed !== g.li.classList.contains('armed')) { g.li.classList.toggle('armed', armed); if (armed) haptic(); }
  }
}, { passive: false });

function flashPress(li) {
  li.classList.add('pressed');
  requestAnimationFrame(() => requestAnimationFrame(() => li.classList.remove('pressed')));
}
function endPointer(e, cancelled) {
  if (drag && e.pointerId === drag.pid) { endDrag(); return; }
  if (dismiss && e.pointerId === dismiss.pid) {
    const d = dismiss; dismiss = null;
    if (!cancelled && Math.hypot(e.clientX - d.x, e.clientY - d.y) < 10 && openId) collapse(cellById(openId));
    return;
  }
  const g = gesture;
  if (!g || e.pointerId !== g.pid) return;
  gesture = null;
  clearTimeout(g.pressTimer);
  if (g.mode === 'pending') {
    if (cancelled) { g.li.classList.remove('pressed'); return; }
    if (g.base < 0) { closeReveal(); return; }
    if (g.thumb) { openViewer(g.li); return; }
    if (!g.li.classList.contains('pressed')) g.li.classList.add('pressed');
    toggleChecked(g.li);
    requestAnimationFrame(() => requestAnimationFrame(() => g.li.classList.remove('pressed')));
    return;
  }
  if (g.mode === 'swipe') {
    const x = g.dx;
    if (!cancelled && (g.li.classList.contains('armed') || (g.v < -1.2 && -x > g.w * .4))) { fullDelete(g.li); return; }
    g.li.classList.remove('armed');
    if (!cancelled && (-x > REV * .5 || (g.v < -.4 && -x > 30)) && !(g.v > .3)) openReveal(g.li);
    else { if (revealed === g.li) revealed = null; setSlide(g.li, 0, 'snap'); }
  }
}
document.addEventListener('pointerup', e => endPointer(e, false));
document.addEventListener('pointercancel', e => endPointer(e, true));

function onListKey(e) {
  const t = e.target;
  if (t.matches && t.matches('.done') && (e.key === 'Enter' || e.key === ' ')) return;
  const row = t.classList && t.classList.contains('row') ? t : null;
  if (!row) return;
  const li = row.closest('.cell');
  if (li.classList.contains('open')) return;
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleChecked(li); flashPress(li); }
  else if (e.key === 'e' || e.key === 'E') { e.preventDefault(); expand(li); }
  else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); removeCell(li, false); }
}
function onListClick(e) {
  const done = e.target.closest('.done');
  if (done) { collapse(done.closest('.cell')); return; }
  // keyboard activation of the thumbnail (pointer taps are handled above)
  const th = e.target.closest('.thumb');
  if (th && e.detail === 0) openViewer(th.closest('.cell'));
}
g0.addEventListener('keydown', onListKey); g1.addEventListener('keydown', onListKey);
g0.addEventListener('click', onListClick); g1.addEventListener('click', onListClick);

/* ---------------- Reorder (grip, pointer events, confined to block) ---------------- */
let drag = null;
function startDrag(e, li, grip) {
  e.preventDefault();
  if (reflowTimer) reflow(false); // settle pending check moves first
  if (openId) collapse(cellById(openId), true);
  closeReveal(true);
  const group = li.parentElement;
  const cells = live(group);
  const i = cells.indexOf(li);
  if (i < 0) return;
  const metrics = cells.map(c => ({ top: c.offsetTop, h: c.offsetHeight }));
  drag = { li, group, i, target: i, cards: cells, metrics, startY: e.clientY, lastY: e.clientY, startScroll: scroller.scrollTop, pid: e.pointerId, raf: 0 };
  try { grip.setPointerCapture(e.pointerId); } catch (_) {}
  li.classList.add('dragging');
  li.style.transform = 'translate3d(0,0,0) scale(1.03)';
  cells.forEach(c => { if (c !== li) c.classList.add('shift'); });
  haptic();
  drag.raf = requestAnimationFrame(autoScroll);
}
function visualOrder(d) {
  const rest = d.cards.filter(c => c !== d.li);
  rest.splice(d.target, 0, d.li);
  return rest;
}
function dragMove() {
  const d = drag, m = d.metrics, self = m[d.i];
  let dy = (d.lastY - d.startY) / fs() + (scroller.scrollTop - d.startScroll);
  const minDy = m[0].top - self.top, last = m[m.length - 1];
  const maxDy = last.top + last.h - self.h - self.top;
  if (dy < minDy) dy = minDy - Math.sqrt(minDy - dy) * 2;
  if (dy > maxDy) dy = maxDy + Math.sqrt(dy - maxDy) * 2;
  d.li.style.transform = `translate3d(0,${dy}px,0) scale(1.03)`;
  const center = self.top + dy + self.h / 2;
  let t = d.i;
  for (let j = d.i + 1; j < m.length; j++) if (center > m[j].top + m[j].h / 2) t = j;
  for (let j = d.i - 1; j >= 0; j--) if (center < m[j].top + m[j].h / 2) t = j;
  if (t !== d.target) {
    d.target = t;
    haptic();
    d.cards.forEach((c, j) => {
      if (j === d.i) return;
      let s = 0;
      if (t > d.i && j > d.i && j <= t) s = -self.h;
      else if (t < d.i && j < d.i && j >= t) s = self.h;
      c.style.transform = s ? `translate3d(0,${s}px,0)` : '';
    });
    shapeGroup(visualOrder(d)); // corners + separators follow the visual order
  }
}
function autoScroll() {
  if (!drag) return;
  const sr = scroller.getBoundingClientRect(), k = fs();
  const topEdge = sr.top + (topInset() + 60) * k;
  const botEdge = sr.top + composerTop() - 50 * k;
  const y = drag.lastY;
  let v = 0;
  if (y < topEdge) v = -Math.min(1, (topEdge - y) / 90);
  else if (y > botEdge) v = Math.min(1, (y - botEdge) / 90);
  if (v) {
    const before = scroller.scrollTop;
    scroller.scrollTop += v * v * Math.sign(v) * 14 + Math.sign(v) * 2;
    if (scroller.scrollTop !== before) dragMove();
  }
  drag.raf = requestAnimationFrame(autoScroll);
}
function endDrag() {
  const d = drag; drag = null;
  cancelAnimationFrame(d.raf);
  const m = d.metrics, self = m[d.i];
  let final = 0;
  if (d.target > d.i) final = m[d.target].top + m[d.target].h - self.h - self.top;
  else if (d.target < d.i) final = m[d.target].top - self.top;
  d.li.classList.add('settling');
  d.li.classList.remove('dragging');
  d.li.style.transform = `translate3d(0,${final}px,0)`;
  setTimeout(() => {
    const order = visualOrder(d);
    if (d.target !== d.i) {
      // re-insert in the one array: before the block item that now follows it,
      // or right after the block item that precedes it if it is now last
      const id = d.li.dataset.id, k = order.indexOf(d.li);
      const from = state.items.findIndex(i => i.id === id);
      const [moved] = state.items.splice(from, 1);
      if (k < order.length - 1) {
        const nextId = order[k + 1].dataset.id;
        state.items.splice(state.items.findIndex(i => i.id === nextId), 0, moved);
      } else {
        const prevId = order[k - 1].dataset.id;
        state.items.splice(state.items.findIndex(i => i.id === prevId) + 1, 0, moved);
      }
      save(true);
    }
    d.group.classList.add('no-anim');
    d.cards.forEach(c => { c.classList.remove('shift', 'settling'); c.style.transform = ''; });
    const ref = order[order.indexOf(d.li) + 1] || null;
    d.group.insertBefore(d.li, ref && ref.parentElement === d.group ? ref : null);
    updateShapes();
    d.group.getBoundingClientRect();
    d.group.classList.remove('no-anim');
  }, dur(300));
}
// block page scroll while dragging / swiping (iOS)
document.addEventListener('touchmove', e => { if (drag || (gesture && gesture.mode === 'swipe')) e.preventDefault(); }, { passive: false });
document.addEventListener('contextmenu', e => { if (!e.target.closest('input,textarea')) e.preventDefault(); });

/* ---------------- Boot ---------------- */
fitFrame();
render();
updateComposer();
layoutPad();
requestAnimationFrame(layoutPad);
framedMQ.addEventListener && framedMQ.addEventListener('change', () => { fitFrame(); onViewport(); });
})();
</script>
</body>
</html>
